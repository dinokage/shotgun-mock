version: "3.8"

services:
  db:
    image: postgres:15-alpine
    container_name: forge-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-forge}
    volumes:
      - forge-db-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      # -h 127.0.0.1 forces a TCP check. Without it, pg_isready connects over
      # the unix socket and can succeed against the temporary, socket-only
      # server the postgres image runs during first-time initdb — reporting
      # "healthy" before the real server accepts connections. start_period
      # gives initdb room on a completely fresh volume.
      test:
        [
          "CMD-SHELL",
          "pg_isready -h 127.0.0.1 -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-forge}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: artifacts/api-server/Dockerfile
    container_name: forge-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # PORT is deliberately NOT set here: the container's internal listening
      # port is fixed at 3001 by the Dockerfile's `ENV PORT=3001`, which is what
      # artifacts/forge/nginx.conf's `proxy_pass http://api:3001/api/` targets.
      # Container-to-container traffic never goes through the host port mapping,
      # so API_PORT below only controls host-side exposure.
      - NODE_ENV=production
      - DATABASE_URL=postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-forge}
      - JWT_SECRET=${JWT_SECRET:-super-secret-jwt-key}
      - CORS_ORIGIN=${CORS_ORIGIN:-*}
      # Session cookie's Secure flag. Defaults to false: this stack has no
      # TLS termination configured anywhere yet (nginx serves plain HTTP),
      # and a Secure cookie is silently dropped by the browser on any
      # non-HTTPS origin except localhost's special-cased exemption -- which
      # is exactly why login worked on localhost but silently failed (POST
      # /auth/login 200, then GET /auth/me 401) on the LAN IP and would fail
      # identically on a real deployed domain without HTTPS. Set to "true"
      # once real TLS is actually terminated in front of this stack.
      - COOKIE_SECURE=${COOKIE_SECURE:-false}
      # Invite emails (nodemailer, artifacts/api-server/src/lib/mailer.ts).
      # SMTP_USER/SMTP_PASSWORD have no dev default -- unset means invites
      # fail loudly (mailer.ts throws) rather than silently going nowhere.
      - SMTP_HOST=${SMTP_HOST:-smtp.gmail.com}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - SMTP_FROM_NAME=${SMTP_FROM_NAME:-Forge}
      # Base URL used to build the accept-invite link in the email --
      # localhost by default; set to the Tailscale address or real company
      # domain so a link works for whoever actually clicks it.
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost}
    ports:
      # <configurable host port>:<fixed container port>
      - "${API_PORT:-3001}:3001"
    # The runner image is a pruned `pnpm deploy` output, not a pnpm workspace,
    # so `pnpm --filter "@workspace/db" ...` has no workspace root to resolve
    # against here. Even `pnpm run migrate` (via `--filter`-free `pnpm run`
    # inside /app/prod/db) fails: `pnpm deploy --legacy` copies package.json
    # verbatim with its "catalog:" version specifiers unresolved, and with no
    # pnpm-workspace.yaml here to resolve them against, pnpm's pre-script
    # dependency check fails with ERR_PNPM_CATALOG_ENTRY_NOT_FOUND_FOR_SPEC —
    # even though node_modules was already correctly installed at build time.
    # Invoke the already-installed tsx binary directly to skip pnpm entirely.
    command: >
      sh -c "cd /app/prod/db && ./node_modules/.bin/tsx src/migrate.ts && cd /app/prod/api-server && node --enable-source-maps ./dist/index.mjs"

  web:
    build:
      context: .
      dockerfile: artifacts/forge/Dockerfile
    container_name: forge-web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-80}:80"

volumes:
  forge-db-data:
