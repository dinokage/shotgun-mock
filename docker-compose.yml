name: shotgun-mock

services:
  db:
    image: postgres:15-alpine
    container_name: forge-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env to a real random value}
      POSTGRES_DB: ${POSTGRES_DB:-forge}
    volumes:
      - forge-db-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      # -h 127.0.0.1 forces a TCP check. Without it, pg_isready connects over
      # the unix socket and can succeed against the temporary, socket-only
      # server the postgres image runs during first-time initdb — reporting
      # "healthy" before the real server accepts connections. start_period
      # gives initdb room on a completely fresh volume.
      test:
        [
          "CMD-SHELL",
          "pg_isready -h 127.0.0.1 -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-forge}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # Periodic pg_dump of the `db` service. Writes to ./backups on the HOST
  # (bind mount, not a named volume) so backups survive `docker compose down
  # -v` -- a named volume would be deleted by the exact command a backup is
  # meant to protect against. See ops/db-backup/backup.sh and restore.sh.
  db-backup:
    image: postgres:15-alpine
    container_name: forge-db-backup
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER:-postgres}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env to a real random value}
      PGDATABASE: ${POSTGRES_DB:-forge}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-21600}
    volumes:
      - ./backups:/backups
      - ./ops/db-backup/backup.sh:/backup.sh:ro
    entrypoint: ["sh", "/backup.sh"]

  redis:
    image: redis:7-alpine
    container_name: forge-redis
    restart: unless-stopped
    # No host port published -- this is an internal cache the api container
    # talks to over the compose network, never accessed from outside.
    # --save disabled: this is a cache, not a source of truth, so an
    # AOF/RDB reload after a restart just means a few cold cache misses,
    # not data loss -- Postgres (backed up above) is the only store that
    # needs durability here.
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Schema migrations, run exactly once per deploy and then exits.
  #
  # Previously every API container ran migrations itself at startup. With one
  # container that was fine; with several replicas they would all race to
  # apply the same migration on boot. Prisma takes an advisory lock so the
  # race is survivable, but the losers sit blocked on the database before
  # serving anything, and a genuine migration failure would be reported N
  # times from N containers. Doing it once, in its own service the API waits
  # on, makes the outcome unambiguous.
  migrate:
    build:
      context: .
      dockerfile: artifacts/api-server/Dockerfile
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env to a real random value}@db:5432/${POSTGRES_DB:-forge}
    command: >
      sh -c "cd /app/prod/db && ./node_modules/.bin/tsx src/migrate.ts"

  api:
    build:
      context: .
      dockerfile: artifacts/api-server/Dockerfile
    # No container_name and no host port mapping: both are single-instance
    # constraints. Compose refuses to scale a service with a fixed container
    # name, and replicas cannot all bind the same host port. The API is
    # reached through nginx over the compose network, so neither was needed.
    # Address a specific replica with `docker compose ps api` when debugging.
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      # PORT is deliberately NOT set here: the container's internal listening
      # port is fixed at 3001 by the Dockerfile's `ENV PORT=3001`, which is what
      # artifacts/forge/nginx.conf's `proxy_pass http://api:3001/api/` targets.
      # Container-to-container traffic never goes through the host port mapping,
      # so API_PORT below only controls host-side exposure.
      - NODE_ENV=production
      - DATABASE_URL=postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env to a real random value}@db:5432/${POSTGRES_DB:-forge}
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET:?Set JWT_SECRET in .env to a real random value}
      - CORS_ORIGIN=${CORS_ORIGIN:-*}
      # Session cookie's Secure flag. Defaults to false: this stack has no
      # TLS termination configured anywhere yet (nginx serves plain HTTP),
      # and a Secure cookie is silently dropped by the browser on any
      # non-HTTPS origin except localhost's special-cased exemption -- which
      # is exactly why login worked on localhost but silently failed (POST
      # /auth/login 200, then GET /auth/me 401) on the LAN IP and would fail
      # identically on a real deployed domain without HTTPS. Set to "true"
      # once real TLS is actually terminated in front of this stack.
      - COOKIE_SECURE=${COOKIE_SECURE:-false}
      # Invite emails (nodemailer, artifacts/api-server/src/lib/mailer.ts).
      # SMTP_USER/SMTP_PASSWORD have no dev default -- unset means invites
      # fail loudly (mailer.ts throws) rather than silently going nowhere.
      - SMTP_HOST=${SMTP_HOST:-smtp.gmail.com}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - SMTP_FROM_NAME=${SMTP_FROM_NAME:-Forge}
      # Base URL used to build the accept-invite link in the email --
      # localhost by default; set to the Tailscale address or real company
      # domain so a link works for whoever actually clicks it.
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost}
      # Outside /app/prod so uploaded files survive a rebuild/redeploy --
      # /app/prod is entirely replaced by each image build.
      - UPLOAD_DIR=/app/uploads
    # Shared named volume, not a per-container one: whichever replica accepts
    # an upload must write where every other replica can later serve it from.
    volumes:
      - forge-uploads-data:/app/uploads
    # The runner image is a pruned `pnpm deploy` output, not a pnpm workspace,
    # so `pnpm --filter "@workspace/db" ...` has no workspace root to resolve
    # against here. Even `pnpm run migrate` (via `--filter`-free `pnpm run`
    # inside /app/prod/db) fails: `pnpm deploy --legacy` copies package.json
    # verbatim with its "catalog:" version specifiers unresolved, and with no
    # pnpm-workspace.yaml here to resolve them against, pnpm's pre-script
    # dependency check fails with ERR_PNPM_CATALOG_ENTRY_NOT_FOUND_FOR_SPEC —
    # even though node_modules was already correctly installed at build time.
    # Invoke the already-installed tsx binary directly to skip pnpm entirely.
    # Serves only. Migrations belong to the `migrate` service above, which
    # this one waits for.
    command: >
      sh -c "cd /app/prod/api-server && node --enable-source-maps ./dist/index.mjs"

  web:
    build:
      context: .
      dockerfile: artifacts/forge/Dockerfile
    container_name: forge-web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-80}:80"

volumes:
  forge-db-data:
  forge-uploads-data:
