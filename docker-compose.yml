version: "3.8"

services:
  db:
    image: postgres:15-alpine
    container_name: forge-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-forge}
    volumes:
      - forge-db-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  api:
    build:
      context: .
      dockerfile: artifacts/api-server/Dockerfile
    container_name: forge-api
    restart: unless-stopped
    depends_on:
      - db
    environment:
      - NODE_ENV=production
      - PORT=${API_PORT:-3001}
      - DATABASE_URL=postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-forge}
      - JWT_SECRET=${JWT_SECRET:-super-secret-jwt-key}
      - CORS_ORIGIN=${CORS_ORIGIN:-*}
    ports:
      - "${API_PORT:-3001}:${API_PORT:-3001}"
    # The runner image is a pruned `pnpm deploy` output, not a pnpm workspace,
    # so `pnpm --filter "@workspace/db" ...` has no workspace root to resolve
    # against here — run the db package's own script directly instead.
    command: >
      sh -c "cd /app/prod/db && pnpm run migrate && cd /app/prod/api-server && node --enable-source-maps ./dist/index.mjs"

  web:
    build:
      context: .
      dockerfile: artifacts/forge/Dockerfile
    container_name: forge-web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-80}:80"

volumes:
  forge-db-data:
