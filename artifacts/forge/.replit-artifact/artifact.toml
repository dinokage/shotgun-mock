kind = "web"
previewPath = "/"
title = "Forge — Production OS"
description = "A frontend-only prototype of Forge, a Production Operating System for VFX, animation, games, and film production tracking. Built for Nebula Animation Co. with rich mock data, 11 sidebar sections, Kanban/Gantt/graph views, and dark/light themes."
version = "1.0.0"
id = "artifacts/forge"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18275

[services.development]
run = "pnpm --filter @workspace/forge run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/forge", "run", "build" ]
serve = "static"
publicDir = "artifacts/forge/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18275"
BASE_PATH = "/"
