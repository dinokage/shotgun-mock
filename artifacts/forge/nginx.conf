server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS server. Naming it explicitly is what makes the
    # variable proxy_pass below legal, and `valid=10s` is what makes this
    # config load-balance.
    #
    # Without a resolver, nginx resolves an upstream name ONCE at startup and
    # caches that single address for the life of the process. That caused two
    # problems this replaces:
    #   1. Recreating the API container left nginx proxying to an address that
    #      no longer existed -- the page loaded but every API call failed,
    #      needing a manual `docker restart forge-web` after each deploy.
    #   2. Scaling the API to several replicas had no effect, because nginx
    #      never learned about any address but the first.
    # Re-resolving every 10 seconds fixes both: Docker's DNS returns all live
    # replica addresses and rotates them, so requests spread across whatever
    # is currently running and a replaced container is picked up on its own.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Proxy API requests to the backend container so relative /api calls
    # (and the session cookie they rely on) work same-origin behind this nginx.
    location /api/ {
        # Held in a variable deliberately: a literal proxy_pass target is
        # resolved once at startup, a variable one is resolved per request
        # through the resolver above. $request_uri carries the original path
        # and query string unchanged, which is required here because a
        # variable proxy_pass does not perform the prefix rewrite that the
        # literal form does.
        set $forge_api "api:3001";
        proxy_pass http://$forge_api$request_uri;

        # A replica that is shutting down, or one that has just been replaced,
        # should cost the user a retry against a healthy sibling rather than a
        # failed request. Only idempotent failures are retried.
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
        proxy_connect_timeout 3s;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cookie_path / /;
        # nginx's own default (1MB) is far below what this API already
        # accepts and validates itself -- routes/uploads.ts's video upload
        # allows up to 500MB, task/avatar attachments up to 200MB/5MB. Below
        # this line, every one of those uploads was silently rejected by
        # nginx before the request ever reached the API (a raw, non-JSON
        # 413 page), which is why the client only ever showed a generic
        # "An error occurred" instead of any real validation message.
        client_max_body_size 512M;
    }

    # Handle SPA routing. Deliberately omits the "$uri/" (directory) fallback
    # that try_files commonly uses: Vite's built-in static output directory is
    # named "assets", which collides with this app's own "/assets" route —
    # with "$uri/" present, nginx resolves "/assets" to that directory, finds
    # no index file in it, and returns a raw 403 instead of ever reaching
    # index.html. A plain file-or-index.html fallback has no such collision.
    # Vite fingerprints every file under /assets, so those are safe to cache
    # forever — the filename changes whenever the content does.
    location /assets/ {
        # Single header on purpose: `expires` emits its own Cache-Control, so
        # pairing it with add_header sends two conflicting ones.
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri /index.html;
    }

    # index.html must never be cached: it is the only file whose name stays
    # the same across deploys, and it is what points at the fingerprinted
    # bundles. A cached copy pins the browser to the previous release's
    # JavaScript, so a deploy appears to do nothing until a hard refresh.
    location / {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri /index.html;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
