server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Proxy API requests to the backend container so relative /api calls
    # (and the session cookie they rely on) work same-origin behind this nginx.
    location /api/ {
        proxy_pass http://api:3001/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cookie_path / /;
        # nginx's own default (1MB) is far below what this API already
        # accepts and validates itself -- routes/uploads.ts's video upload
        # allows up to 500MB, task/avatar attachments up to 200MB/5MB. Below
        # this line, every one of those uploads was silently rejected by
        # nginx before the request ever reached the API (a raw, non-JSON
        # 413 page), which is why the client only ever showed a generic
        # "An error occurred" instead of any real validation message.
        client_max_body_size 512M;
    }

    # Handle SPA routing. Deliberately omits the "$uri/" (directory) fallback
    # that try_files commonly uses: Vite's built-in static output directory is
    # named "assets", which collides with this app's own "/assets" route —
    # with "$uri/" present, nginx resolves "/assets" to that directory, finds
    # no index file in it, and returns a raw 403 instead of ever reaching
    # index.html. A plain file-or-index.html fallback has no such collision.
    location / {
        try_files $uri /index.html;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
