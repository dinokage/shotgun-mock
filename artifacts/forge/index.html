<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1"
    />
    <title>Forge — Production OS</title>
    <meta
      name="description"
      content="Forge — Production OS — built on Replit. Update this description to reflect the app."
    />
    <meta name="robots" content="index, follow" />
    <meta property="og:title" content="Forge — Production OS" />
    <meta
      property="og:description"
      content="Forge — Production OS — built on Replit. Update this description to reflect the app."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Forge — Production OS" />
    <meta
      name="twitter:description"
      content="Forge — Production OS — built on Replit. Update this description to reflect the app."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  </head>
  <body>
    <script>
      window.onerror = function (msg, url, line, col, error) {
        document.body.innerHTML =
          '<div style="padding: 20px; background: #fee2e2; color: #991b1b; font-family: monospace; min-height: 100vh;">' +
          "<h1>GLOBAL SCRIPT ERROR</h1>" +
          "<p><strong>Message:</strong> " +
          msg +
          "</p>" +
          "<p><strong>URL:</strong> " +
          url +
          ":" +
          line +
          ":" +
          col +
          "</p>" +
          '<pre style="background: #fef2f2; padding: 10px; border: 1px solid #fca5a5; overflow-x: auto;">' +
          (error ? error.stack : "") +
          "</pre>" +
          "</div>";
      };
      window.addEventListener("unhandledrejection", function (e) {
        document.body.innerHTML =
          '<div style="padding: 20px; background: #fee2e2; color: #991b1b; font-family: monospace; min-height: 100vh;">' +
          "<h1>UNHANDLED PROMISE REJECTION</h1>" +
          "<p><strong>Reason:</strong> " +
          e.reason +
          "</p>" +
          '<pre style="background: #fef2f2; padding: 10px; border: 1px solid #fca5a5; overflow-x: auto;">' +
          (e.reason && e.reason.stack ? e.reason.stack : "") +
          "</pre>" +
          "</div>";
      });
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
